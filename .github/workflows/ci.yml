name: CI

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:

            - uses: actions/checkout@v7

            - name: Build image
              run: docker build -t tinyshop-api:${{ github.sha }} ./app

            - name: Show image
              run: docker images tinyshop-api