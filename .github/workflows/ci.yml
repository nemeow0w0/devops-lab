name: CI

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:

            - uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: Gitleaks scan
              run: |
                docker run --rm \
                    -v "$PWD:/repo:ro" \
                    ghcr.io/gitleaks/gitleaks:v8.30.1 \
                    git /repo --redact --verbose

            - name: Build image
              run: docker build -t tinyshop-api:${{ github.sha }} ./app

            - name: Show image
              run: docker images tinyshop-api

            - name: Trivy scan
              run: |
                docker run --rm \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    aquasec/trivy:0.76.1 image \
                    --severity HIGH,CRITICAL \
                    --exit-code 1 \
                    tinyshop-api:${{ github.sha}}

