name: CI

on:
    push:
        branches: [main]

permissions:
    contents: read
    packages: write

env: 
    IMAGE: ghcr.io/nemeow0w0/tinyshop-api:${{ github.sha}}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                fetch-depth: 0

            - name: Gitleaks scan
              run: |
                docker run --rm \
                    -v "$PWD:/repo:ro" \
                    ghcr.io/gitleaks/gitleaks:v8.30.1 \
                    git /repo --redact --verbose

            - name: Build image
              run: docker build -t  "$IMAGE" ./app


            - name: Trivy scan
              run: |
                docker run --rm \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    aquasec/trivy:0.76.1 image \
                    --severity HIGH,CRITICAL \
                    --exit-code 1 \
                    "$IMAGE"

            - name: Login to GHCR
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
              run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin


            - name: Push image
              run: docker push "$IMAGE"
