name: Practice

on:
    push:
        branches: [main]

permissions:
    contents: read
    

env:
    IMAGE: ghcr.io/nemeow0w0/tinyshop-api:${{ github.sha }}
jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - name: Files before checkout
              run: ls -al
              
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
              with:
                fetch-depth: 0

            - name: Gitleaks scan
              run: |
                docker run --rm \
                    -v "$PWD:/repo:ro" \
                    ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
                    git /repo --redact --verbose


            - name: Say hello
              run: echo "Hello CI!"

            - name: Who am I
              run: whoami


            - name: Where am I
              run: pwd

            - name: What files
              run: ls -al

            - name: Show images name
              run: echo "$IMAGE"

            - name: Build image
              run: |
                docker build -t "$IMAGE" ./app
                docker images

            - name: Trivy scan
              run: |
                docker run --rm \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image \
                    --severity HIGH,CRITICAL \
                    --exit-code 1 \
                    "$IMAGE"