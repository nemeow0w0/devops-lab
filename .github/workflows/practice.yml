name: Practice

on:
    push:
        branches: [main]

permissions:
    contents: read
    
jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - name: Files before checkout
              run: ls -al
              
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

            - name: Say hello
              run: echo "Hello CI!"

            - name: Who am I
              run: whoami

            - name: Whare am I
              run: pwd

            - name: What files
              run: ls -al