apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tinyshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/nemeow0w0/tinyshop-api@sha256:89e95cd4fb5f8caf283b025e367fa4cae8d2e0eb47ae84b8677bc3f0b5c22e06  # gitleaks:allow
          env:
            - name: PGHOST
              value: db
            - name: PGUSER
              value: shop
            - name: PGDATABASE
              value: shop
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tinyshop-db
                  key: PG_PASS
          ports:
            - containerPort: 3355
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tinyshop
spec:
  selector:
    app: api
  ports:
    - port: 3355