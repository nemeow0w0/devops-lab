services:
  api:
    build: ./app
    image: tinyshop-api:1.5
    environment:
      PGHOST: db
      PGUSER: shop
      PGPASSWORD: ${PG_PASS}
      PGDATABASE: shop
    depends_on:
      db:
        condition: service_healthy
    init: true
    ports:
      - "127.0.0.1:3355:3355"

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL"," pg_isready -U shop"]
      interval: 5s
      retries: 5
    
  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASS:?missing in .env}
    volumes:
      - ./grafana.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana  


volumes:
  pgdata:
  grafana-data: