services:
  api:
    build: ./app
    image: tinyshop-api:1.3
    environment:
      PGHOST: db
      PGUSER: shop
      PGPASSWORD: ${PG_PASS}
      PGDATABASE: shop
    depends_on:
      db:
        condition: service_healthy
    init: true
    ports:
      - "127.0.0.1:3355:3355"

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL"," pg_isready -U shop"]
      interval: 5s
      retries: 5


volumes:
  pgdata: